name: version-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a plugin version bump when skills/ changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = 'pull_request' ]; then
            base="origin/$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'No base commit to compare against; skipping.'
            exit 0
          fi
          bash .github/scripts/check-version-bump.sh "$base"
